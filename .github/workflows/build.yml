name: Compiler le mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler
        run: dotnet build GravityFlip.csproj -c Release

      - name: Préparer le paquet
        run: |
          mkdir -p paquet
          cp bin/Release/GravityFlip.dll manifest.json README.md paquet/
          cd paquet && zip -r ../GravityFlip.zip .

      - name: Envoyer la DLL (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: GravityFlip
          path: paquet/

      # La version vient de manifest.json : la changer là crée une nouvelle release.
      - name: Lire la version
        id: version
        run: echo "tag=v$(jq -r .version_number manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gravity Flip ${{ steps.version.outputs.tag }}
          body: Copier GravityFlip.dll dans ULTRAKILL/BepInEx/plugins/GravityFlip/ (BepInEx 5 requis). GravityFlip.zip est le paquet Thunderstore.
          files: |
            paquet/GravityFlip.dll
            GravityFlip.zip
