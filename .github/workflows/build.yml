name: Compiler le mod

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler
        run: dotnet build GravityFlip.csproj -c Release

      - name: Préparer le paquet
        run: |
          mkdir -p paquet
          cp bin/Release/GravityFlip.dll manifest.json README.md paquet/
          cd paquet && zip -r ../GravityFlip.zip .

      - name: Envoyer la DLL (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: GravityFlip
          path: paquet/

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paquet/GravityFlip.dll
            GravityFlip.zip
